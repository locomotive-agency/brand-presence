project_id: example-project
client_id: example
location: EU
time_zone: Europe/Amsterdam
state_dir: .brand-presence
datasets:
  ref: bp_ref
  ops: bp_ops
  raw: bp_raw
  stg: bp_stg
  core: bp_core
  mart: bp_mart
brands:
  - brand_id: aardvark
    name: Example Aardvark
    aliases: []
    domains: [aardvark.example]
countries:
  - country_code: NL
    language: nl
    canonical_name: Netherlands
benchmark_sets:
  - client_brand_id: aardvark
    country_code: NL
    # Uncomment to collect Cloro answers for this set.
    # prompts:
    #   - prompt_id: example-kettle
    #     prompt: Which invented kettle keeps tea warm?
    #     engines: [chatgpt, perplexity, gemini, ai-overview]
    #     location_ids: []
    #     keyword: example kettle
    #     keyword_group: kettles
    #     intent: comparison
    # competitors: [example-rival]
    # Add every competitor to brands before listing it here.
    keywords:
      - keyword: sample aardvark theepot
        term_type: brand
        brand_id: aardvark
      - keyword: voorbeeld theepot kopen
        term_type: generic

mention_text_days: 366
# Uncomment and replace tags to collect Syften mentions.
# mention_filters:
#   - tag: example-aardvark-nl
#     mention_class: brand
#     client_brand_id: aardvark
#     subject_brand_id: aardvark
#     country_code: NL
#     keyword_group: kettles
# subreddits:
#   - subreddit: example_kettles
#     community_group: kettles
#     subscribers: null
#     subscribers_as_of: null

# Optional regional Cloro locations. Use the location_id in a prompt's location_ids.
# locations:
#   - location_id: example-region
#     country_code: NL
#     name: Example region
#     canonical_name: Example region,Netherlands
#     region_code: NL-NH
#     sources: [ai-answers]

# Uncomment and replace vendor references to collect existing Peec prompts.
# peec_projects:
#   - mapping: example-peec-nl
#     project_id: example-project
#     client_brand_id: aardvark
#     country_code: NL
#     engines: [chatgpt, perplexity, gemini, ai-overview]
#     first_date: 2026-01-01
# peec_brands:
#   - mapping: example-peec-nl
#     brand_id: aardvark
#     vendor_brand_id: example-brand
# Add one peec_brands entry for each competitor in the benchmark set.

# Search Console API. The ID is your own stable name for this site.
# web_properties:
#   - web_property_id: example-site
#     client_brand_id: aardvark
#     source: search-console
#     address: sc-domain:aardvark.example
#     hostname: shop.aardvark.example  # Optional filter for a shared site.

# GA4 API. Add this entry to web_properties above.
#   - web_property_id: example-analytics
#     client_brand_id: aardvark
#     source: ga4
#     address: '100000001'  # Invented numeric property ID. Keep the quotes.
#     hostname: shop.aardvark.example  # Optional.
# Optional city report. Add entries to locations.
#   - location_id: example-city
#     country_code: NL
#     kind: city
#     name: Example City
#     canonical_name: Example City,Example Region,Netherlands
#     sources: [ga4]

# Google Ads API. Use your own ten-digit customer ID, without hyphens.
# ad_accounts:
#   - ad_account_id: example-ads
#     client_brand_id: aardvark  # Optional. Omit to retain unknown ownership.
#     customer_id: '1000000001'
# Optional paid brand-search groups, evaluated in match_order.
# modifiers:
#   - modifier: price
#     match_order: 1
#   - modifier: reviews
#     match_order: 2
# Optional Google Ads geography. Add entries to locations above.
#   - location_id: example-ads-region
#     country_code: NL
#     kind: region
#     name: Example Region
#     canonical_name: Example Region,Netherlands
#     region_code: NL-NH
#     sources: [google-ads]
#     google_criterion_id: '1000000'  # Replace with Google's public location criterion.
# A keyword can optionally set canonical_term to another keyword in the same set.
# Credentials belong in environment variables, never this file.

# Optional BigQuery export routes. Add either entry to web_properties above.
# API remains the default when route is omitted.
#   - web_property_id: example-export-analytics
#     client_brand_id: aardvark
#     source: ga4
#     address: '100000003'  # Invented. Use your GA4 property number.
#     route: export
#     project: example-export-project
#     dataset: example_analytics_export
#   - web_property_id: example-export-search
#     client_brand_id: aardvark
#     source: search-console
#     address: sc-domain:export.aardvark.example
#     route: export
#     project: example-export-project
#     dataset: example_search_export
# maximum_bytes_billed: 21474836480  # Per export query, not per run.
# GA4 exports need setup-geo-targets with a date from Google's official file list.
# Optional named export pages. API-only projects need no pages list.
# pages:
#   - page_path: /pricing
#     page_group: Commercial
