chart_group: brand modifiers
grain: One row per month, client brand and modifier, from January 2024, of the search terms that named the client brand. The table holds counts per modifier and never a term.
key: [month, client_brand_id, modifier]
reads: [core.fct_ads_search_terms_v1, ref.current_brands, ref.current_modifiers, ref.current_ad_accounts, stg.google_ads_pulls]
inputs: []
checks: []
columns:
  - name: month
    type: DATE
    kind: key
    nullable: false
    meaning: The first day of the calendar month, of the account's own days.
  - name: client_brand_id
    type: STRING
    kind: key
    nullable: false
    meaning: The client brand the terms named, the client brand of the ad accounts.
    holds: client brand
  - name: modifier
    type: STRING
    kind: key
    nullable: false
    meaning: The modifier of today's modifiers configuration the term holds as whole words once the client brand's name and aliases are taken out of it, the first in the match_order where it holds several; brand only for a term that holds none.
  - name: search_terms
    type: INT64
    kind: attribute
    nullable: false
    meaning: The distinct terms of the month that named the client brand and took this modifier, letter case and punctuation aside. A count, never the terms.
  - name: impressions
    type: INT64
    kind: measure
    nullable: false
    meaning: Times an ad was shown on those terms in the month.
    unit: impressions
    sums:
      over: [modifier]
      dates: any
  - name: clicks
    type: INT64
    kind: denominator
    nullable: false
    meaning: Clicks on an ad shown on those terms in the month.
    unit: clicks
    sums:
      over: [modifier]
      dates: any
  - name: conversions
    type: NUMERIC
    kind: numerator
    nullable: false
    meaning: Conversions of those clicks, counted on the day of the click, as the platform reports them.
    unit: conversions
    sums:
      over: [modifier]
      dates: any
    denominator: clicks
  - name: conversion_rate
    type: FLOAT64
    kind: ratio
    nullable: true
    meaning: conversions over clicks. Null where there was no click.
    unit: conversions per click
    numerator: conversions
    denominator: clicks
  - name: is_complete_month
    type: BOOL
    kind: attribute
    nullable: false
    meaning: False for the month in progress in the client's time zone, and for a month whose days the search terms report was not pulled for, each of them, for an account of the client brand in today's ad_accounts configuration or an account the row was made from.
  - name: pulled_at
    type: TIMESTAMP
    kind: attribute
    nullable: false
    meaning: The latest pulled_at of the fact rows the row was made from.
