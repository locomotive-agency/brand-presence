kind: fact
chart_group: engagement
grain: One row per month, client brand, web property, country, geography level, location and channel group, each time a build saw it change, from the newest pull period that read the month from the property's GA4 BigQuery export. Each place has a row for each channel group and one with channel group (all). The rows of a web property that is no longer current stay. A report reads current properties through ref.current_web_properties.
key: [month, client_brand_id, web_property_id, country_code, geo_level, location_id, channel_group, pulled_at]
reads: [stg.ga4_export_engagement, ref.current_locations]
inputs: []
checks: [first_of_month, geo_level_known]
columns:
  - name: month
    type: DATE
    kind: key
    nullable: false
    meaning: The first day of the month, of the GA4 property's own days.
  - name: client_brand_id
    type: STRING
    kind: key
    nullable: false
    meaning: The client brand the web property is for.
    holds: client brand
  - name: web_property_id
    type: STRING
    kind: key
    nullable: false
    meaning: The GA4 property, by the ID the YAML configuration gives it. Never its number, and never the export's name.
  - name: country_code
    type: STRING
    kind: key
    nullable: false
    meaning: The place's country, as a two-letter code. unknown on the one national row of every country the client does not list and of traffic GA4 could not place.
    holds: country
  - name: geo_level
    type: STRING
    kind: key
    nullable: false
    meaning: national for a country, state for a region listed for ga4, city for a city listed for ga4. A state row holds its cities' traffic, and a national row its states'. A reader never adds rows of one level to rows of another.
  - name: location_id
    type: STRING
    kind: key
    nullable: false
    meaning: The place, by its ID in ref.locations. unknown with the country unknown.
  - name: channel_group
    type: STRING
    kind: key
    nullable: false
    meaning: The session default channel group as GA4's export names it, (not set) where it names none, as it does for every session before mid October 2024, or (all) for every channel of the place together.
  - name: through_date
    type: DATE
    kind: attribute
    nullable: false
    meaning: The last day of the month the row counts, as the newest period read it. The last day of it, up to that period's last date, that the export holds a daily table of.
  - name: period_start
    type: DATE
    kind: attribute
    nullable: false
    meaning: The first day of the newest pull period that read the month, whose figures the row holds. A reader keeps only the rows of the month's latest period_start for the property, so a row the newest period does not hold is left out.
  - name: sessions
    type: INT64
    kind: measure
    nullable: false
    meaning: Sessions in the month. Added over channel groups only without the (all) row, and over places only between places that do not hold each other.
    unit: sessions
    sums:
      over: [month, web_property_id]
      dates: any
  - name: page_views
    type: INT64
    kind: measure
    nullable: false
    meaning: Page views, page_view events, in the month. Added as sessions are.
    unit: views
    sums:
      over: [month, web_property_id]
      dates: any
  - name: engagement_seconds
    type: NUMERIC
    kind: measure
    nullable: false
    meaning: User engagement duration in the month, in seconds, summed over the sessions. Added as sessions are.
    unit: seconds
    sums:
      over: [month, web_property_id]
      dates: any
  - name: active_users
    type: INT64
    kind: measure
    nullable: false
    meaning: Distinct users with an engaged session in the month, place and channel group. Never added across rows, places or months; read the (all) row for a place's users.
    unit: users
    sums:
      over: []
      dates: none
  - name: total_users
    type: INT64
    kind: measure
    nullable: false
    meaning: Distinct users of the month, place and channel group. Never added across rows, places or months; read the (all) row for a place's users.
    unit: users
    sums:
      over: []
      dates: none
  - name: new_users
    type: INT64
    kind: measure
    nullable: false
    meaning: Distinct users whose first visit is in the month, place and channel group. Never added across rows, places or months.
    unit: users
    sums:
      over: []
      dates: none
  - name: returning_users
    type: INT64
    kind: measure
    nullable: false
    meaning: Distinct users with a session in the month, place and channel group that is not their first. Never added across rows, places or months, and not total users less new users, since a new user who comes back is in both.
    unit: users
    sums:
      over: []
      dates: none
  - name: pulled_at
    type: TIMESTAMP
    kind: key
    nullable: false
    meaning: When the fact's build saw the row. The runner gives it; a reader takes the latest per month, client brand, web property, country, level, location and channel group.
