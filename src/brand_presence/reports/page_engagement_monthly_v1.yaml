chart_group: engagement
grain: One row per month, client brand, web property and page path on today's pages list, read from the GA4 BigQuery export, every country together. Only the ga4 properties of today's web properties list, read through ref.current_web_properties, on the export route have rows. The rows of a web property that is no longer current stay in the facts and are not shown here.
key: [month, client_brand_id, web_property_id, page_path]
reads: [core.fct_ga4_export_pages_v1, stg.ga4_pulls, ref.current_web_properties, ref.current_pages]
inputs: []
checks: []
columns:
  - name: month
    type: DATE
    kind: key
    nullable: false
    meaning: The first day of the month, of the GA4 property's own days. Rows start in January 2024.
  - name: client_brand_id
    type: STRING
    kind: key
    nullable: false
    meaning: The client brand the web property is for.
    holds: client brand
  - name: web_property_id
    type: STRING
    kind: key
    nullable: false
    meaning: The GA4 property, by the ID the YAML configuration gives it. Never its number.
  - name: page_path
    type: STRING
    kind: key
    nullable: false
    meaning: The page's path, with no query string and no fragment, as the pages list names it and the export gives it.
  - name: page_group
    type: STRING
    kind: dimension
    nullable: false
    meaning: The group today's pages list gives the path.
  - name: ga4_route
    type: STRING
    kind: dimension
    nullable: false
    meaning: Always export. A property read through the Data API has no page row.
  - name: page_views
    type: INT64
    kind: measure
    nullable: false
    meaning: Page views, page_view events, of the page in the month.
    unit: views
    sums:
      over: [month, web_property_id, page_path]
      dates: any
  - name: users
    type: INT64
    kind: denominator
    nullable: false
    meaning: Distinct users who viewed the page in the month. Never added across pages or months, since a user who viewed two pages is in both.
    unit: users
    sums:
      over: []
      dates: none
  - name: engagement_duration_sec
    type: NUMERIC
    kind: numerator
    nullable: false
    meaning: User engagement duration on the page in the month, in seconds.
    unit: seconds
    sums:
      over: [month, web_property_id, page_path]
      dates: any
    denominator: users
  - name: avg_engagement_sec
    type: FLOAT64
    kind: ratio
    nullable: true
    meaning: Engagement seconds over users, the engagement time per user of the page. Null where the page had no user.
    unit: seconds per user
    numerator: engagement_duration_sec
    denominator: users
  - name: is_complete_month
    type: BOOL
    kind: attribute
    nullable: false
    meaning: False for the month in progress in the client's time zone, and for a month the fact does not cover to its last day.
  - name: pulled_at
    type: TIMESTAMP
    kind: attribute
    nullable: false
    meaning: The pulled_at of the fact row the row was made from.
