kind: fact
chart_group: paid media
grain: One row per month, client brand, ad account, campaign, country, geography level, location, location type and currency, each time a build saw it change. Country rows come from the country report; region and city rows from the region and city reports, a listed place or the rest of the country. A reader never adds rows of one level to rows of another.
key: [month, client_brand_id, ad_account_id, campaign_id, country_code, geo_level, location_id, location_type, currency_code, pulled_at]
reads: [stg.google_ads_geo, stg.google_ads_geo_regions, stg.google_ads_geo_cities, stg.google_ads_campaigns, stg.google_ads_pulls, ref.locations]
inputs: []
checks: [first_of_month, geo_level_known]
columns:
  - name: month
    type: DATE
    kind: key
    nullable: false
    meaning: The first day of the calendar month, of the account's own days.
  - name: client_brand_id
    type: STRING
    kind: key
    nullable: false
    meaning: The client brand of the ad account, or unknown where the configuration names none.
    holds: client brand
  - name: ad_account_id
    type: STRING
    kind: key
    nullable: false
    meaning: The ad account, by the ID the YAML configuration gives it. Never its customer ID.
  - name: campaign_id
    type: INT64
    kind: key
    nullable: false
    meaning: Google's ID of the campaign.
  - name: country_code
    type: STRING
    kind: key
    nullable: false
    meaning: The country the report gives, as a two-letter code, whether or not the client lists it; unknown where the row holds no country criterion.
    holds: country
  - name: geo_level
    type: STRING
    kind: key
    nullable: false
    meaning: country for a row of the country report, region for a row of the region report, city for a row of the city report. A reader never adds rows of one level to rows of another.
  - name: location_id
    type: STRING
    kind: key
    nullable: false
    meaning: On a country row, the country's own location. On a region or city row, the listed region's or city's location, or the country's own location for the report's other row, the rest of the country beyond its listed places. unknown where the country is.
  - name: location_type
    type: STRING
    kind: key
    nullable: false
    meaning: presence where the person was in the place, interest where they showed interest in it. The two overlap and are never added.
  - name: currency_code
    type: STRING
    kind: key
    nullable: false
    meaning: The currency of the account's costs, three letters.
  - name: channel_type
    type: STRING
    kind: attribute
    nullable: true
    meaning: The campaign's advertising channel type, as Google Ads names it in the campaigns report, the same on every row of the campaign. Null where that report holds no row of the campaign.
  - name: impressions
    type: INT64
    kind: measure
    nullable: false
    meaning: Times an ad was shown in the month, from the latest pull of each day.
    unit: impressions
    sums:
      over: [ad_account_id, campaign_id, location_id, currency_code]
      dates: any
  - name: clicks
    type: INT64
    kind: measure
    nullable: false
    meaning: Clicks on an ad in the month, from the latest pull of each day.
    unit: clicks
    sums:
      over: [ad_account_id, campaign_id, location_id, currency_code]
      dates: any
  - name: cost_micros
    type: INT64
    kind: measure
    nullable: false
    meaning: The cost in the month, in millionths of the account's currency, exactly as reported and never converted. Costs in two currencies are never added.
    unit: millionths of the currency in currency_code
    sums:
      over: [ad_account_id, campaign_id, location_id]
      dates: any
    currency: currency_code
  - name: conversions
    type: NUMERIC
    kind: measure
    nullable: false
    meaning: Conversions counted on the day of the click, as Google Ads knew them when each day was last pulled. Each day's figure is cast to NUMERIC before the sum.
    unit: conversions
    sums:
      over: [ad_account_id, campaign_id, location_id, currency_code]
      dates: any
  - name: days_covered
    type: INT64
    kind: attribute
    nullable: true
    meaning: The days of the month the account's report of the row's level was pulled for, from the pulls' windows, so a day with no activity counts. A month is whole when it is the month's number of days. Null where no pull of that report is recorded.
  - name: pulled_at
    type: TIMESTAMP
    kind: key
    nullable: false
    meaning: When the fact's build saw the row. The runner gives it; a reader takes the latest per month, client brand, ad account, campaign, country, level, location, location type and currency.
