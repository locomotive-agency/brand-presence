chart_group: ai answers
grain: One row per week_start, source, keyword_group. Only observed weeks are present; countries and locations
  are combined within the client project.
key:
- week_start
- source
- keyword_group
reads: []
inputs:
- ai_prompt_results_v2
- peec_prompt_results_v1
checks:
- weekly_values
- answer_states
columns:
- name: week_start
  type: DATE
  kind: key
  nullable: false
  meaning: Monday of the ISO week of run_date. Cloro uses the client time zone; Peec uses the verified
    vendor observation date, as the existing prompt reports do.
- name: source
  type: STRING
  kind: key
  nullable: false
  meaning: cloro for ai-answers, or peec. Sources are never combined.
- name: keyword_group
  type: STRING
  kind: key
  nullable: true
  meaning: The prompt's keyword group from the YAML configuration; unknown where the prompt has none,
    which today is every Peec prompt (Peec owns its prompts).
- name: queries_total
  type: INT64
  kind: measure
  nullable: false
  meaning: Runs of the ai-overview engine, each answer once regardless of benchmark brand count.
  unit: answers
  sums:
    over: []
    dates: any
- name: queries_with_aio
  type: INT64
  kind: measure
  nullable: false
  meaning: Runs of the ai-overview engine whose answer_state is answered. The existing state none shown
    does not count; any other state fails the named check.
  unit: answers
  sums:
    over: []
    dates: any
