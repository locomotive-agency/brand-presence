kind: fact
chart_group: ai answers
grain: One row per month, client brand, country, location, prompt, engine, pull period and link the answer cites, each time a build saw it change.
key: [month, client_brand_id, country_code, location_id, prompt_id, engine, period, link, pulled_at]
reads: [stg.ai_answers]
inputs: []
checks: [first_of_month]
columns:
  - name: month
    type: DATE
    kind: key
    nullable: false
    meaning: The first day of the calendar month the pull period begins in.
  - name: client_brand_id
    type: STRING
    kind: key
    nullable: false
    meaning: The client brand the prompt was asked for.
    holds: client brand
  - name: country_code
    type: STRING
    kind: key
    nullable: false
    meaning: The country, as a two-letter code.
    holds: country
  - name: location_id
    type: STRING
    kind: key
    nullable: false
    meaning: The location the prompt was asked from, by its ID in ref.locations.
  - name: prompt_id
    type: STRING
    kind: key
    nullable: false
    meaning: The prompt, by its ID in the benchmark set.
  - name: engine
    type: STRING
    kind: key
    nullable: false
    meaning: The engine asked, as the pipeline names it.
  - name: period
    type: STRING
    kind: key
    nullable: false
    meaning: The pull period, as the run names it.
  - name: link
    type: STRING
    kind: key
    nullable: false
    meaning: A link the answer cites, as the vendor gave it. An answer cites each link once.
  - name: period_start
    type: DATE
    kind: attribute
    nullable: false
    meaning: The first day of the pull period, in the client's time zone.
  - name: source_pulled_at
    type: TIMESTAMP
    kind: attribute
    nullable: false
    meaning: When the source received the answer the link came from. The same on every link of one answer; a reader takes an answer's links of its latest answer.
  - name: pulled_at
    type: TIMESTAMP
    kind: key
    nullable: false
    meaning: When the fact's build saw the row. The runner gives it; a reader takes the latest per month, client brand, country, location, prompt, engine, period and link.
