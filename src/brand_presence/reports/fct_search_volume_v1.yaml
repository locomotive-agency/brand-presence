kind: fact
chart_group: demand
grain: One row per month, client brand, country, location and keyword, each time a build saw it change.
key: [month, client_brand_id, country_code, location_id, keyword, pulled_at]
reads: [stg.search_volume]
inputs: []
checks: [first_of_month]
columns:
  - name: month
    type: DATE
    kind: key
    nullable: false
    meaning: The first day of the calendar month the figure is of.
  - name: client_brand_id
    type: STRING
    kind: key
    nullable: false
    meaning: The client brand the keyword was measured for.
    holds: client brand
  - name: country_code
    type: STRING
    kind: key
    nullable: false
    meaning: The country, as a two-letter code.
    holds: country
  - name: location_id
    type: STRING
    kind: key
    nullable: false
    meaning: The location the figure is for, by its ID in ref.locations. A country's own location and its regions and cities each have rows, so rows of one country are not added across locations.
  - name: keyword
    type: STRING
    kind: key
    nullable: false
    meaning: The keyword, as the benchmark set lists it.
  - name: term_type
    type: STRING
    kind: dimension
    nullable: false
    meaning: The keyword's term type in the benchmark set when it was pulled, as the source wrote it, brand, competitor or generic.
  - name: subject_brand_id
    type: STRING
    kind: dimension
    nullable: true
    meaning: The brand the keyword is about, by its brand ID, as the source wrote it. Null for a generic keyword.
  - name: benchmark_version
    type: INT64
    kind: attribute
    nullable: true
    meaning: The version of the client brand's benchmark set the shown pull was planned from. Null where the brand had no set in the country.
  - name: search_volume
    type: INT64
    kind: measure
    nullable: true
    meaning: The keyword's searches in the month and location, from the latest pull of the month. Null where the vendor gave no figure, which counts as below the vendor's threshold.
    unit: searches in the month, as the vendor estimates them
    sums:
      over: [keyword]
      dates: any
  - name: pulled_at
    type: TIMESTAMP
    kind: key
    nullable: false
    meaning: When the fact's build saw the row. The runner gives it; a reader takes the latest per month, client brand, country, location and keyword.
