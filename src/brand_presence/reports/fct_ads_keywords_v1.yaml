kind: fact
chart_group: paid media
grain: One row per month, client brand, ad account, campaign, keyword text and match type, each time a build saw it change. Search campaigns alone.
key: [month, client_brand_id, ad_account_id, campaign_id, keyword_text, match_type, pulled_at]
reads: [stg.google_ads_keywords]
inputs: []
checks: [first_of_month]
columns:
  - name: month
    type: DATE
    kind: key
    nullable: false
    meaning: The first day of the calendar month, of the account's own days.
  - name: client_brand_id
    type: STRING
    kind: key
    nullable: false
    meaning: The client brand of the ad account, or unknown where the configuration names none.
    holds: client brand
  - name: ad_account_id
    type: STRING
    kind: key
    nullable: false
    meaning: The ad account, by the ID the YAML configuration gives it. Never its customer ID.
  - name: campaign_id
    type: INT64
    kind: key
    nullable: false
    meaning: Google's ID of the campaign.
  - name: keyword_text
    type: STRING
    kind: key
    nullable: false
    meaning: The keyword the advertiser bid on, as Google Ads gives it. Not what a person typed. One row for every ad group of the campaign that holds it.
  - name: match_type
    type: STRING
    kind: key
    nullable: false
    meaning: The keyword's match type, as Google Ads names it.
  - name: impressions
    type: INT64
    kind: measure
    nullable: false
    meaning: Times an ad was shown on the keyword in the month, from the latest pull of each day.
    unit: impressions
    sums:
      over: [ad_account_id, campaign_id, keyword_text, match_type]
      dates: any
  - name: pulled_at
    type: TIMESTAMP
    kind: key
    nullable: false
    meaning: When the fact's build saw the row. The runner gives it; a reader takes the latest per month, client brand, ad account, campaign, keyword text and match type.
