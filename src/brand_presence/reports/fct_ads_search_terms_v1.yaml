kind: fact
chart_group: brand modifiers
grain: One row per month, client brand, ad account, campaign and search term, each time a build saw it change. Only campaigns the search terms view covers, and only terms Google gives.
key: [month, client_brand_id, ad_account_id, campaign_id, search_term, pulled_at]
reads: [stg.google_ads_search_terms, stg.google_ads_pulls]
inputs: []
checks: [first_of_month]
columns:
  - name: month
    type: DATE
    kind: key
    nullable: false
    meaning: The first day of the calendar month, of the account's own days.
  - name: client_brand_id
    type: STRING
    kind: key
    nullable: false
    meaning: The client brand of the ad account, or unknown where the configuration names none.
    holds: client brand
  - name: ad_account_id
    type: STRING
    kind: key
    nullable: false
    meaning: The ad account, by the ID the YAML configuration gives it. Never its customer ID.
  - name: campaign_id
    type: INT64
    kind: key
    nullable: false
    meaning: Google's ID of the campaign.
  - name: search_term
    type: STRING
    kind: key
    nullable: false
    meaning: What a person typed that showed an ad, as Google Ads gives it. Not the keyword the advertiser bid on. No serving table holds it.
  - name: impressions
    type: INT64
    kind: measure
    nullable: false
    meaning: Times an ad was shown on the term in the month, from the latest pull of each day.
    unit: impressions
    sums:
      over: [ad_account_id, campaign_id, search_term]
      dates: any
  - name: clicks
    type: INT64
    kind: measure
    nullable: false
    meaning: Clicks on an ad shown on the term in the month, from the latest pull of each day.
    unit: clicks
    sums:
      over: [ad_account_id, campaign_id, search_term]
      dates: any
  - name: conversions
    type: NUMERIC
    kind: measure
    nullable: false
    meaning: Conversions counted on the day of the click, as Google Ads knew them when each day was last pulled. Each day's figure is cast to NUMERIC before the sum.
    unit: conversions
    sums:
      over: [ad_account_id, campaign_id, search_term]
      dates: any
  - name: days_covered
    type: INT64
    kind: attribute
    nullable: true
    meaning: The days of the month the account's search terms report was pulled for, from the pulls' windows, so a day with no activity counts. A month is whole when it is the month's number of days. Null where no pull of that report is recorded.
  - name: pulled_at
    type: TIMESTAMP
    kind: key
    nullable: false
    meaning: When the fact's build saw the row. The runner gives it; a reader takes the latest per month, client brand, ad account, campaign and search term.
