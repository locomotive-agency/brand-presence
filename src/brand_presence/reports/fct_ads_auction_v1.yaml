kind: fact
chart_group: paid media
grain: One row per month, client brand, ad account, campaign and currency, each time a build saw it change. The campaigns report holds no country, so the fact holds none.
key: [month, client_brand_id, ad_account_id, campaign_id, currency_code, pulled_at]
reads: [stg.google_ads_campaigns]
inputs: []
checks: [first_of_month]
columns:
  - name: month
    type: DATE
    kind: key
    nullable: false
    meaning: The first day of the calendar month, of the account's own days.
  - name: client_brand_id
    type: STRING
    kind: key
    nullable: false
    meaning: The client brand of the ad account, or unknown where the configuration names none.
    holds: client brand
  - name: ad_account_id
    type: STRING
    kind: key
    nullable: false
    meaning: The ad account, by the ID the YAML configuration gives it. Never its customer ID.
  - name: campaign_id
    type: INT64
    kind: key
    nullable: false
    meaning: Google's ID of the campaign.
  - name: currency_code
    type: STRING
    kind: key
    nullable: false
    meaning: The currency of the account's costs, three letters. The fact holds no money; the currency ties its rows to the account's delivery rows.
  - name: channel_type
    type: STRING
    kind: attribute
    nullable: false
    meaning: The campaign's advertising channel type, as Google Ads names it.
  - name: impressions
    type: INT64
    kind: measure
    nullable: false
    meaning: Times an ad of the campaign was shown in the month, from the latest pull of each day.
    unit: impressions
    sums:
      over: [ad_account_id, campaign_id, currency_code]
      dates: any
  - name: auction_impressions
    type: INT64
    kind: measure
    nullable: true
    meaning: The impressions of the days of the month that hold eligible impressions, the top of the impression share. Null where no day does.
    unit: impressions
    sums:
      over: [ad_account_id, campaign_id, currency_code]
      dates: any
  - name: eligible_impressions
    type: INT64
    kind: measure
    nullable: true
    meaning: The search impressions the campaign was eligible for in the month, summed over the days that hold a figure. Null where no day does.
    unit: impressions
    sums:
      over: [ad_account_id, campaign_id, currency_code]
      dates: any
  - name: absolute_top_impressions
    type: INT64
    kind: measure
    nullable: true
    meaning: The search impressions shown at the absolute top, of the days of the month that hold absolute top eligible impressions, the top of the absolute top impression share. Null where no day does.
    unit: impressions
    sums:
      over: [ad_account_id, campaign_id, currency_code]
      dates: any
  - name: absolute_top_eligible_impressions
    type: INT64
    kind: measure
    nullable: true
    meaning: The impressions the campaign was eligible for at the absolute top in the month, summed over the days that hold a figure. Null where no day does.
    unit: impressions
    sums:
      over: [ad_account_id, campaign_id, currency_code]
      dates: any
  - name: rank_lost_impressions
    type: INT64
    kind: measure
    nullable: true
    meaning: The eligible impressions lost to ad rank in the month, summed over the days that hold a figure. Null where no day does.
    unit: impressions
    sums:
      over: [ad_account_id, campaign_id, currency_code]
      dates: any
  - name: rank_lost_eligible_impressions
    type: INT64
    kind: measure
    nullable: true
    meaning: The search impressions the campaign was eligible for, of the days of the month that hold impressions lost to ad rank, the bottom of the rank-lost impression share. Null where no day does.
    unit: impressions
    sums:
      over: [ad_account_id, campaign_id, currency_code]
      dates: any
  - name: budget_lost_impressions
    type: INT64
    kind: measure
    nullable: true
    meaning: The eligible impressions lost to budget in the month, summed over the days that hold a figure. Null where no day does.
    unit: impressions
    sums:
      over: [ad_account_id, campaign_id, currency_code]
      dates: any
  - name: budget_lost_eligible_impressions
    type: INT64
    kind: measure
    nullable: true
    meaning: The search impressions the campaign was eligible for, of the days of the month that hold impressions lost to budget, the bottom of the budget-lost impression share. Null where no day does.
    unit: impressions
    sums:
      over: [ad_account_id, campaign_id, currency_code]
      dates: any
  - name: impression_share_bounded
    type: BOOL
    kind: attribute
    nullable: true
    meaning: True where a day of the month had a share at a bound Google reports instead of the figure, so the counts worked out from it are a bound and not an estimate. Null where every day was written before the column was added.
  - name: pulled_at
    type: TIMESTAMP
    kind: key
    nullable: false
    meaning: When the fact's build saw the row. The runner gives it; a reader takes the latest per month, client brand, ad account, campaign and currency.
