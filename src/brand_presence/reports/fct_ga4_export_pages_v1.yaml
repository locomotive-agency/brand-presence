kind: fact
chart_group: engagement
grain: One row per month, client brand, web property and page path, each time a build saw it change, from the newest pull period that read the month from the property's GA4 BigQuery export, every country together. The rows of a web property that is no longer current stay. A report reads current properties through ref.current_web_properties.
key: [month, client_brand_id, web_property_id, page_path, pulled_at]
reads: [stg.ga4_export_pages]
inputs: []
checks: [first_of_month]
columns:
  - name: month
    type: DATE
    kind: key
    nullable: false
    meaning: The first day of the month, of the GA4 property's own days.
  - name: client_brand_id
    type: STRING
    kind: key
    nullable: false
    meaning: The client brand the web property is for.
    holds: client brand
  - name: web_property_id
    type: STRING
    kind: key
    nullable: false
    meaning: The GA4 property, by the ID the YAML configuration gives it. Never its number, and never the export's name.
  - name: page_path
    type: STRING
    kind: key
    nullable: false
    meaning: The path of the page's address, with no query string and no fragment, as the export route stored it. (other) folds the pages past the month's most viewed; (not set) is an event with no page address.
  - name: through_date
    type: DATE
    kind: attribute
    nullable: false
    meaning: The last day of the month the row counts, as the newest period read it. The last day of it, up to that period's last date, that the export holds a daily table of.
  - name: period_start
    type: DATE
    kind: attribute
    nullable: false
    meaning: The first day of the newest pull period that read the month, whose figures the row holds. A reader keeps only the rows of the month's latest period_start for the property, so a row the newest period does not hold is left out.
  - name: page_views
    type: INT64
    kind: measure
    nullable: false
    meaning: Page views, page_view events, of the page in the month.
    unit: views
    sums:
      over: [month, web_property_id, page_path]
      dates: any
  - name: users
    type: INT64
    kind: measure
    nullable: false
    meaning: Distinct users who viewed the page in the month. Never added across pages or months, since a user who viewed two pages is in both.
    unit: users
    sums:
      over: []
      dates: none
  - name: engagement_seconds
    type: NUMERIC
    kind: measure
    nullable: false
    meaning: User engagement duration on the page in the month, in seconds, summed over its events.
    unit: seconds
    sums:
      over: [month, web_property_id, page_path]
      dates: any
  - name: pulled_at
    type: TIMESTAMP
    kind: key
    nullable: false
    meaning: When the fact's build saw the row. The runner gives it; a reader takes the latest per month, client brand, web property and page path.
