table: stg.google_ads_campaigns
owner: google-ads
version: 1
grain: One row per ad account, campaign, date and period. A day with no activity has no row.
key:
- ad_account_id
- campaign_id
- date
- period
unknown: 'The country and the location are always unknown: the report does not say where an impression
  was. The client brand is unknown where the configuration names none for the account.'
days: The account's own days, counted in the time zone the account counts in, which the pull row names
  in source_time_zone. Not the client's days.
columns:
- name: client_brand_id
  type: STRING
  kind: dimension
  nullable: false
  meaning: The client brand of the ad account, or unknown where the configuration names none.
  holds: client brand
- name: country_code
  type: STRING
  kind: dimension
  nullable: false
  meaning: The country. Always unknown.
  holds: country
- name: location_id
  type: STRING
  kind: dimension
  nullable: false
  meaning: The location. Always unknown.
  holds: location
- name: benchmark_version
  type: INT64
  kind: attribute
  nullable: true
  meaning: The version of the client brand's benchmark set in the row's country, at the load the request
    was planned from.
  null_means: The row belongs to no benchmark set.
- name: snapshot_id
  type: STRING
  kind: attribute
  nullable: false
  meaning: The snapshot of the YAML configuration the request was planned from.
- name: period
  type: STRING
  kind: key
  nullable: false
  meaning: The period of the pull that wrote the row, as the run names it.
- name: period_start
  type: DATE
  kind: attribute
  nullable: false
  meaning: The first day of the row's period, in the client's time zone.
- name: request_key
  type: STRING
  kind: attribute
  nullable: false
  meaning: The vendor request the row came from.
- name: run_id
  type: STRING
  kind: attribute
  nullable: false
  meaning: The run that wrote the row.
- name: pulled_at
  type: TIMESTAMP
  kind: attribute
  nullable: false
  meaning: When the answer the row came from was received.
- name: ad_account_id
  type: STRING
  kind: key
  nullable: false
  meaning: The ID the YAML configuration gives the ad account. Never its customer ID.
- name: campaign_id
  type: INT64
  kind: key
  nullable: false
  meaning: Google's ID of the campaign.
- name: campaign_name
  type: STRING
  kind: attribute
  nullable: false
  meaning: The campaign's name, as the advertiser wrote it. No country or brand is taken from it.
- name: channel_type
  type: STRING
  kind: dimension
  nullable: false
  meaning: The campaign's advertising channel type, as Google Ads names it.
- name: campaign_status
  type: STRING
  kind: attribute
  nullable: false
  meaning: The campaign's status, as Google Ads names it.
- name: date
  type: DATE
  kind: key
  nullable: false
  meaning: The account's own day, in its own time zone.
- name: impressions
  type: INT64
  kind: measure
  nullable: false
  meaning: Times an ad was shown.
  unit: impressions
  sums:
    summable: true
    over:
    - ad_account_id
    - campaign_id
    - date
- name: clicks
  type: INT64
  kind: measure
  nullable: false
  meaning: Clicks on an ad.
  unit: clicks
  sums:
    summable: true
    over:
    - ad_account_id
    - campaign_id
    - date
- name: cost_micros
  type: INT64
  kind: measure
  nullable: false
  meaning: The cost exactly as reported, never converted or rounded. Costs in two currencies cannot be
    added up.
  unit: millionths of the currency in currency_code
  sums:
    summable: true
    over:
    - ad_account_id
    - campaign_id
    - date
  money: true
  currency: currency_code
- name: conversions
  type: FLOAT64
  kind: measure
  nullable: false
  meaning: 'Conversions counted on the day of the click. As Google Ads knew them when the week was pulled:
    Google Ads may add to them afterwards, and a later scheduled run does not ask again.'
  unit: conversions
  sums:
    summable: true
    over:
    - ad_account_id
    - campaign_id
    - date
- name: conversions_by_conversion_date
  type: FLOAT64
  kind: measure
  nullable: false
  meaning: 'Conversions counted on the day they happened. As Google Ads knew them when the week was pulled:
    Google Ads may add to them afterwards, and a later scheduled run does not ask again.'
  unit: conversions
  sums:
    summable: true
    over:
    - ad_account_id
    - campaign_id
    - date
- name: search_impression_share
  type: FLOAT64
  kind: measure
  nullable: true
  meaning: 'The share of eligible search impressions the campaign got, as reported. A ratio with no numerator
    or denominator: it cannot be summed or averaged across rows.'
  null_means: Google gives none for the campaign.
  unit: share of eligible impressions, 0 to 1
  sums:
    summable: false
- name: currency_code
  type: STRING
  kind: dimension
  nullable: false
  meaning: The currency of the account's costs, three letters, as its details gave it.
- name: absolute_top_impression_percentage
  type: FLOAT64
  kind: measure
  nullable: true
  meaning: 'The share of the campaign''s own search impressions shown as the very first ad above the organic
    results, as reported. A ratio with no numerator or denominator: it cannot be summed or averaged across
    rows.'
  null_means: Google gives none for the campaign, or the row was written before the column was added.
  unit: share of the campaign's impressions, 0 to 1
  sums:
    summable: false
- name: search_absolute_top_impression_share
  type: FLOAT64
  kind: measure
  nullable: true
  meaning: 'The impressions at the absolute top over those the campaign was eligible for there, as reported.
    A value below 0.1 is reported as 0.0999. A ratio with no numerator or denominator: it cannot be summed
    or averaged across rows.'
  null_means: Google gives none for the campaign, or the row was written before the column was added.
  unit: share of impressions eligible at the absolute top, 0 to 1
  sums:
    summable: false
- name: search_rank_lost_impression_share
  type: FLOAT64
  kind: measure
  nullable: true
  meaning: 'The share of eligible search impressions lost to ad rank, as reported. A value above 0.9 is
    reported as 0.9001. A ratio with no numerator or denominator: it cannot be summed or averaged across
    rows.'
  null_means: Google gives none for the campaign, or the row was written before the column was added.
  unit: share of eligible impressions, 0 to 1
  sums:
    summable: false
- name: search_budget_lost_impression_share
  type: FLOAT64
  kind: measure
  nullable: true
  meaning: 'The share of eligible search impressions lost to budget, as reported. A value above 0.9 is
    reported as 0.9001. A ratio with no numerator or denominator: it cannot be summed or averaged across
    rows.'
  null_means: Google gives none for the campaign, or the row was written before the column was added.
  unit: share of eligible impressions, 0 to 1
  sums:
    summable: false
- name: eligible_impressions
  type: INT64
  kind: measure
  nullable: true
  meaning: The search impressions the campaign was eligible for, impressions over search_impression_share,
    to the nearest whole number. A bound where impression_share_bounded is true.
  null_means: The share is null or zero, or the row was written before the column was added.
  unit: impressions
  sums:
    summable: true
    over:
    - ad_account_id
    - campaign_id
    - date
- name: absolute_top_impressions
  type: INT64
  kind: measure
  nullable: true
  meaning: The search impressions shown at the absolute top, impressions times absolute_top_impression_percentage,
    to the nearest whole number.
  null_means: That share is null, or the row was written before the column was added.
  unit: impressions
  sums:
    summable: true
    over:
    - ad_account_id
    - campaign_id
    - date
- name: absolute_top_eligible_impressions
  type: INT64
  kind: measure
  nullable: true
  meaning: The impressions the campaign was eligible for at the absolute top, as the share counts them,
    absolute_top_impressions over search_absolute_top_impression_share, to the nearest whole number. A
    bound where impression_share_bounded is true.
  null_means: Either is null or the share is zero, or the row was written before the column was added.
  unit: impressions
  sums:
    summable: true
    over:
    - ad_account_id
    - campaign_id
    - date
- name: rank_lost_impressions
  type: INT64
  kind: measure
  nullable: true
  meaning: The eligible impressions lost to ad rank, eligible_impressions times search_rank_lost_impression_share,
    to the nearest whole number. A bound where impression_share_bounded is true.
  null_means: Either is null, or the row was written before the column was added.
  unit: impressions
  sums:
    summable: true
    over:
    - ad_account_id
    - campaign_id
    - date
- name: budget_lost_impressions
  type: INT64
  kind: measure
  nullable: true
  meaning: The eligible impressions lost to budget, eligible_impressions times search_budget_lost_impression_share,
    to the nearest whole number. A bound where impression_share_bounded is true.
  null_means: Either is null, or the row was written before the column was added.
  unit: impressions
  sums:
    summable: true
    over:
    - ad_account_id
    - campaign_id
    - date
- name: impression_share_bounded
  type: BOOL
  kind: attribute
  nullable: true
  meaning: True where a share of the row is at a bound Google reports instead of the figure, 0.0999 for
    a share below 0.1 or 0.9001 for a lost share above 0.9. The counts worked out from it are then a bound,
    not an estimate.
  null_means: The row was written before the column was added.
