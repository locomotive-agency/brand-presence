table: stg.ga4_export_engagement
owner: ga4
version: 1
grain: One row per client brand, web property, month, place, channel group and period, read from the property's
  GA4 BigQuery export. Each listed place has a row for each channel group and one with channel group (all).
  Users are distinct at the row's grain, and are never summed across rows.
key:
- client_brand_id
- web_property_id
- month
- location_id
- channel_group
- period
unknown: 'The country and the location are unknown on the one national row of every country the client
  does not list and of traffic GA4 could not place. The client brand never is: it is the web property''s.'
days: The GA4 property's own days, counted in the property's time zone, by which the export names
  each daily table. A month is a month of those days. Not the client's days.
columns:
- name: client_brand_id
  type: STRING
  kind: key
  nullable: false
  meaning: The client brand the row was measured for, by its brand ID in the YAML configuration.
  holds: client brand
- name: country_code
  type: STRING
  kind: dimension
  nullable: false
  meaning: The place's country, as a two-letter code. unknown on the national row of every country the
    client does not list and of traffic GA4 could not place.
  holds: country
- name: location_id
  type: STRING
  kind: key
  nullable: false
  meaning: 'The place, by its ID in ref.locations: a listed country''s own location, a region or a city
    the client lists for ga4. unknown with the country unknown.'
  holds: location
- name: benchmark_version
  type: INT64
  kind: attribute
  nullable: true
  meaning: The version of the client brand's benchmark set in the row's country, at the load the request
    was planned from.
  null_means: 'The client brand has no benchmark set in the row''s country, or the row belongs to none:
    a mention, or a pull of every country.'
- name: snapshot_id
  type: STRING
  kind: attribute
  nullable: false
  meaning: The snapshot of the YAML configuration the request was planned from.
- name: period
  type: STRING
  kind: key
  nullable: false
  meaning: 'The period of the pull that wrote the row, as the run names it. A month is read by every weekly
    pull until the month after it has ended, and period tells their rows apart: the newest period''s row
    is the month''s figure.'
- name: period_start
  type: DATE
  kind: attribute
  nullable: false
  meaning: The first day of the row's period, in the client's time zone.
- name: request_key
  type: STRING
  kind: attribute
  nullable: false
  meaning: The vendor request the row came from.
- name: run_id
  type: STRING
  kind: attribute
  nullable: false
  meaning: The run that wrote the row.
- name: pulled_at
  type: TIMESTAMP
  kind: attribute
  nullable: false
  meaning: When the answer the row came from was received.
- name: web_property_id
  type: STRING
  kind: key
  nullable: false
  meaning: The GA4 property, by the ID the YAML configuration gives it. Never its number, and never the export's
    name.
- name: month
  type: DATE
  kind: key
  nullable: false
  meaning: The first day of the month the row counts.
- name: through_date
  type: DATE
  kind: attribute
  nullable: false
  meaning: 'The last day of the month the row counts: the last day of it, up to the period''s last date,
    that the export holds a daily table of. A month is whole when this is its last day; the pull row''s
    days_without_table counts the days with no table.'
- name: geo_level
  type: STRING
  kind: dimension
  nullable: false
  meaning: national for a country, state for a listed region, city for a listed city. A state row holds
    its listed cities' traffic, and a national row its states'.
- name: channel_group
  type: STRING
  kind: key
  nullable: false
  meaning: 'The session''s default channel group as GA4''s export names it, (not set) where it names none,
    or (all): every channel of the place together, with the place''s distinct users.'
- name: sessions
  type: INT64
  kind: measure
  nullable: false
  meaning: Sessions. Summed over channel groups only without the (all) row, and over places only between
    places that do not hold each other.
  unit: sessions
  sums:
    summable: true
    over:
    - web_property_id
    - month
    across_periods: false
- name: active_users
  type: INT64
  kind: measure
  nullable: false
  meaning: 'Distinct users with an engaged session in the month, place and channel group. It cannot be
    summed: a user seen in two channels, places or months is in both. Read the (all) row for a place''s
    users.'
  unit: users
  sums:
    summable: false
- name: total_users
  type: INT64
  kind: measure
  nullable: false
  meaning: 'Distinct users of the month, place and channel group. It cannot be summed: a user seen in
    two channels, places or months is in both. Read the (all) row for a place''s users.'
  unit: users
  sums:
    summable: false
- name: new_users
  type: INT64
  kind: measure
  nullable: false
  meaning: Distinct users whose first visit is in the month, place and channel group. It cannot be summed.
  unit: users
  sums:
    summable: false
- name: returning_users
  type: INT64
  kind: measure
  nullable: false
  meaning: 'Distinct users with a session after their first in the month, place and channel group. It
    cannot be summed, and it is not total users less new users: a new user who comes back is in both.'
  unit: users
  sums:
    summable: false
- name: page_views
  type: INT64
  kind: measure
  nullable: false
  meaning: 'Page views: page_view events. Summed as sessions are.'
  unit: views
  sums:
    summable: true
    over:
    - web_property_id
    - month
    across_periods: false
- name: engagement_seconds
  type: NUMERIC
  kind: measure
  nullable: false
  meaning: User engagement duration, summed over the sessions. Summed as sessions are.
  unit: seconds
  sums:
    summable: true
    over:
    - web_property_id
    - month
    across_periods: false
