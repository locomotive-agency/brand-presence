table: stg.ai_answers
owner: ai-answers
version: 1
grain: 'One row per client brand, country, location, prompt, engine and period: one answer to a prompt
  asked of an engine.'
key:
- client_brand_id
- country_code
- location_id
- prompt_id
- engine
- period
unknown: 'Never: every row is planned from a benchmark set, so its client brand, country and location
  are those of the set.'
columns:
- name: client_brand_id
  type: STRING
  kind: key
  nullable: false
  meaning: The client brand the row was measured for, by its brand ID in the YAML configuration.
  holds: client brand
- name: country_code
  type: STRING
  kind: key
  nullable: false
  meaning: The country, as a two-letter code.
  holds: country
- name: location_id
  type: STRING
  kind: key
  nullable: false
  meaning: The location the request was for, by its ID in ref.locations.
  holds: location
- name: benchmark_version
  type: INT64
  kind: attribute
  nullable: true
  meaning: The version of the client brand's benchmark set in the row's country, at the load the request
    was planned from.
  null_means: 'The client brand has no benchmark set in the row''s country, or the row belongs to
    none: a mention, or a pull of every country.'
- name: snapshot_id
  type: STRING
  kind: attribute
  nullable: false
  meaning: The snapshot of the YAML configuration the request was planned from.
- name: period
  type: STRING
  kind: key
  nullable: false
  meaning: The period of the pull that wrote the row, as the run names it. It tells apart the rows
    of two pulls of the same dates.
- name: period_start
  type: DATE
  kind: attribute
  nullable: false
  meaning: The first day of the row's period, in the client's time zone.
- name: request_key
  type: STRING
  kind: attribute
  nullable: false
  meaning: The vendor request the row came from.
- name: run_id
  type: STRING
  kind: attribute
  nullable: false
  meaning: The run that wrote the row.
- name: pulled_at
  type: TIMESTAMP
  kind: attribute
  nullable: false
  meaning: When the answer the row came from was received.
- name: prompt_id
  type: STRING
  kind: key
  nullable: false
  meaning: The prompt, by its ID in the benchmark set.
- name: engine
  type: STRING
  kind: key
  nullable: false
  meaning: The engine asked, as the pipeline names it.
- name: state
  type: STRING
  kind: dimension
  nullable: false
  meaning: 'What came back: answered, or none shown where the engine showed no answer.'
- name: answer_text
  type: STRING
  kind: attribute
  nullable: true
  meaning: The answer's text.
  null_means: No answer was shown.
- name: model
  type: STRING
  kind: attribute
  nullable: true
  meaning: The model that answered, as the vendor names it.
  null_means: The vendor did not say.
- name: cited_domains
  type: ARRAY<STRING>
  kind: attribute
  nullable: true
  meaning: The domains of the pages the answer cites, each once.
  null_means: 'Never null in the table: an answer that cites nothing has an empty list.'
- name: cited_links
  type: ARRAY<STRING>
  kind: attribute
  nullable: true
  meaning: Every link the answer cites, as the vendor gives it, each once, in the answer's order. The
    domains of the same links are in cited_domains.
  null_means: 'Never null in the table: an answer that cites nothing has an empty list. A row stored
    without captured links has an empty list too, even where cited_domains is not empty; a rebuild of
    its period fills it.'
