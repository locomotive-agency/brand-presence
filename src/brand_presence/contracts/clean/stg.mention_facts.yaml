table: stg.mention_facts
owner: mentions
version: 1
grain: 'One row per match: what can be counted of a post the vendor matched. It holds nothing of the
  post itself.'
key:
- match_id
unknown: 'The client brand, the country or the location is unknown where the mapping of the match''s
  tag in ref.mention_filters does not give it: all three when the tag has no mapping, the location
  when the country has no location of kind country in the load.'
columns:
- name: client_brand_id
  type: STRING
  kind: dimension
  nullable: false
  meaning: The client brand the row was measured for, by its brand ID in the YAML configuration. unknown
    where the mapping gives none.
  holds: client brand
- name: country_code
  type: STRING
  kind: dimension
  nullable: false
  meaning: The country, as a two-letter code. unknown where the source could not place the row.
  holds: country
- name: location_id
  type: STRING
  kind: dimension
  nullable: false
  meaning: The location the request was for, by its ID in ref.locations.
  holds: location
- name: benchmark_version
  type: INT64
  kind: attribute
  nullable: true
  meaning: The version of the client brand's benchmark set in the row's country, at the load the request
    was planned from.
  null_means: 'The client brand has no benchmark set in the row''s country, or the row belongs to
    none: a mention, or a pull of every country.'
- name: snapshot_id
  type: STRING
  kind: attribute
  nullable: false
  meaning: The snapshot of the YAML configuration the request was planned from.
- name: period
  type: STRING
  kind: attribute
  nullable: false
  meaning: The period of the run that pulled the match.
- name: period_start
  type: DATE
  kind: attribute
  nullable: false
  meaning: The first day of the row's period, in the client's time zone.
- name: request_key
  type: STRING
  kind: attribute
  nullable: false
  meaning: The vendor request the row came from.
- name: run_id
  type: STRING
  kind: attribute
  nullable: false
  meaning: The run that wrote the row.
- name: pulled_at
  type: TIMESTAMP
  kind: attribute
  nullable: false
  meaning: When the answer the row came from was received.
- name: match_id
  type: STRING
  kind: key
  nullable: false
  meaning: The match, by the vendor's ID.
- name: match_date
  type: DATE
  kind: dimension
  nullable: false
  meaning: The day of matched_at.
- name: matched_at
  type: TIMESTAMP
  kind: attribute
  nullable: false
  meaning: When the vendor matched the post.
- name: posted_at
  type: TIMESTAMP
  kind: attribute
  nullable: true
  meaning: When the post was made.
  null_means: The vendor did not say.
- name: community
  type: STRING
  kind: dimension
  nullable: true
  meaning: Where the post was made, as the vendor names it.
  null_means: The vendor did not say.
- name: sub_community
  type: STRING
  kind: dimension
  nullable: true
  meaning: The part of the community the post was made in, as the vendor names it.
  null_means: The vendor did not say.
- name: item_type
  type: STRING
  kind: dimension
  nullable: true
  meaning: The kind of post, as the vendor names it.
  null_means: The vendor did not say.
- name: language
  type: STRING
  kind: dimension
  nullable: true
  meaning: The post's language, as the vendor gives it.
  null_means: The vendor did not say.
- name: mention_class
  type: STRING
  kind: dimension
  nullable: false
  meaning: 'The class of the filter that caught the match: brand, competitor, category or other.'
- name: subject_brand_id
  type: STRING
  kind: dimension
  nullable: true
  meaning: The brand the match's filter is about.
  null_means: The filter names no brand.
- name: accepted
  type: BOOL
  kind: attribute
  nullable: true
  meaning: What the vendor's own filter made of the match.
  null_means: The vendor did not say.
- name: sentiment
  type: STRING
  kind: attribute
  nullable: true
  meaning: Not filled yet.
  null_means: 'Always null: not filled yet.'
- name: topics
  type: STRING
  kind: attribute
  nullable: true
  meaning: Not filled yet.
  null_means: 'Always null: not filled yet.'
- name: keyword_group
  type: STRING
  kind: dimension
  nullable: true
  meaning: The keyword group of the match's filter in the YAML configuration, as the load the run was
    under gave it. A group changed later is on the matches stored after the change.
  null_means: The filter named no group, or the value was not captured.
