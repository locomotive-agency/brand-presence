table: stg.google_ads_pulls
owner: google-ads
version: 1
grain: 'One row per Google Ads request and period: one pull of an ad account''s report.'
key:
- ad_account_id
- report
- period
unknown: 'The client brand is unknown where the configuration names none for the account. The country and the
  location never are: a pull of every country carries the reserved value all.'
days: The account's own days, counted in the time zone the account counts in, which the pull row names
  in source_time_zone. Not the client's days.
columns:
- name: client_brand_id
  type: STRING
  kind: dimension
  nullable: false
  meaning: The client brand of the ad account, or unknown where the configuration names none.
  holds: client brand
- name: country_code
  type: STRING
  kind: dimension
  nullable: false
  meaning: The country. A pull of every country carries all.
  holds: country
- name: location_id
  type: STRING
  kind: dimension
  nullable: false
  meaning: The location. A pull of every country carries all.
  holds: location
- name: benchmark_version
  type: INT64
  kind: attribute
  nullable: true
  meaning: The version of the client brand's benchmark set in the row's country, at the load the request
    was planned from.
  null_means: A pull of every country belongs to no benchmark set.
- name: snapshot_id
  type: STRING
  kind: attribute
  nullable: false
  meaning: The snapshot of the YAML configuration the request was planned from.
- name: period
  type: STRING
  kind: key
  nullable: false
  meaning: The period of the pull that wrote the row, as the run names it.
- name: period_start
  type: DATE
  kind: attribute
  nullable: false
  meaning: The first day of the row's period, in the client's time zone.
- name: request_key
  type: STRING
  kind: attribute
  nullable: false
  meaning: The vendor request the row came from.
- name: run_id
  type: STRING
  kind: attribute
  nullable: false
  meaning: The run that wrote the row.
- name: pulled_at
  type: TIMESTAMP
  kind: attribute
  nullable: false
  meaning: When the answer the row came from was received.
- name: window_start
  type: DATE
  kind: attribute
  nullable: false
  meaning: The first date of the window the pull asked for.
- name: window_end
  type: DATE
  kind: attribute
  nullable: false
  meaning: The last date of the window the pull asked for.
- name: rows_written
  type: INT64
  kind: measure
  nullable: false
  meaning: 'The clean rows the report gave. Zero for a report with no row: an account that ran nothing
    that week.'
  unit: rows
  sums:
    summable: true
    over:
    - ad_account_id
    - report
    across_periods: true
- name: pages
  type: INT64
  kind: measure
  nullable: false
  meaning: The pages of the report read. The account's details are not counted.
  unit: pages
  sums:
    summable: true
    over:
    - ad_account_id
    - report
    across_periods: true
- name: row_limit_hit
  type: BOOL
  kind: attribute
  nullable: false
  meaning: 'Always false: every page of a report is read, with no cap.'
- name: source_time_zone
  type: STRING
  kind: attribute
  nullable: true
  meaning: The time zone the account counts its days in, as its details gave it in the run.
  null_means: The pull did not record it.
- name: ad_account_id
  type: STRING
  kind: key
  nullable: false
  meaning: The ID the YAML configuration gives the ad account. Never its customer ID.
- name: report
  type: STRING
  kind: key
  nullable: false
  meaning: 'The report asked for: campaigns, geography or keywords.'
- name: currency_code
  type: STRING
  kind: attribute
  nullable: false
  meaning: The account's currency, as its details gave it in the run, never taken from a report's rows.
- name: rows_without_criterion
  type: INT64
  kind: attribute
  nullable: true
  meaning: For a geography, geography_cities or geography_regions pull, the rows with no country criterion,
    written under unknown with their figures.
  null_means: The pull is of another report, or was written before the column.
- name: criteria_not_in_table
  type: INT64
  kind: attribute
  nullable: true
  meaning: For a geography, geography_cities or geography_regions pull, the rows whose country criterion
    the country table does not hold, written under unknown with their figures.
  null_means: The pull is of another report, or was written before the column.
- name: listed_places_unmatched
  type: INT64
  kind: attribute
  nullable: true
  meaning: For a geography_cities or geography_regions pull, the places listed for google-ads in a country
    the answer holds rows of that no row matched. Their figures, if any, are in the other rows.
  null_means: The pull is of another report, or was written before the column.
