table: stg.search_console_pulls
owner: search-console
version: 1
grain: 'One row per Search Console request and period: one pull of a site and search type.'
key:
- web_property_id
- search_type
- period
unknown: Never. A pull of every country carries the reserved value all as its country and its location,
  not unknown.
days: Search Console's own days, counted in Pacific time. Not the client's days.
columns:
- name: client_brand_id
  type: STRING
  kind: dimension
  nullable: false
  meaning: The client brand the row was measured for, by its brand ID in the YAML configuration.
  holds: client brand
- name: country_code
  type: STRING
  kind: dimension
  nullable: false
  meaning: The country, as a two-letter code. A pull of every country carries all.
  holds: country
- name: location_id
  type: STRING
  kind: dimension
  nullable: false
  meaning: The location the request was for, by its ID in ref.locations. A pull of every country carries
    all.
  holds: location
- name: benchmark_version
  type: INT64
  kind: attribute
  nullable: true
  meaning: The version of the client brand's benchmark set in the row's country, at the load the request
    was planned from.
  null_means: 'The client brand has no benchmark set in the row''s country, or the row belongs to none:
    a mention, or a pull of every country.'
- name: snapshot_id
  type: STRING
  kind: attribute
  nullable: false
  meaning: The snapshot of the YAML configuration the request was planned from.
- name: period
  type: STRING
  kind: key
  nullable: false
  meaning: The period of the pull that wrote the row, as the run names it. It tells apart the rows of
    two pulls of the same dates.
- name: period_start
  type: DATE
  kind: attribute
  nullable: false
  meaning: The first day of the row's period, in the client's time zone.
- name: request_key
  type: STRING
  kind: attribute
  nullable: false
  meaning: The vendor request the row came from.
- name: run_id
  type: STRING
  kind: attribute
  nullable: false
  meaning: The run that wrote the row.
- name: pulled_at
  type: TIMESTAMP
  kind: attribute
  nullable: false
  meaning: When the answer the row came from was received.
- name: window_start
  type: DATE
  kind: attribute
  nullable: false
  meaning: The first date of the window the pull asked for.
- name: window_end
  type: DATE
  kind: attribute
  nullable: false
  meaning: The last date of the window the pull asked for.
- name: rows_written
  type: INT64
  kind: measure
  nullable: false
  meaning: The totals rows and the query rows the pull gave, together.
  unit: rows
  sums:
    summable: true
    over:
    - web_property_id
    - search_type
    across_periods: true
- name: pages
  type: INT64
  kind: measure
  nullable: false
  meaning: The pages read, over both parts.
  unit: pages
  sums:
    summable: true
    over:
    - web_property_id
    - search_type
    across_periods: true
- name: row_limit_hit
  type: BOOL
  kind: attribute
  nullable: false
  meaning: 'True when the queries part stopped at the pipeline''s page cap with its last page full,
    or when one date holds as many query rows as the service states it returns for a day. False says
    only that no limit was seen, not that every row came: Search Console may leave rows out with no
    sign. The two shares are the measure.'
- name: source_time_zone
  type: STRING
  kind: attribute
  nullable: true
  meaning: 'The time zone Search Console counts its days in: Pacific time, for every site.'
  null_means: The pull did not record it.
- name: web_property_id
  type: STRING
  kind: key
  nullable: false
  meaning: The Search Console site, by the ID the YAML configuration gives it. Never its address.
- name: search_type
  type: STRING
  kind: key
  nullable: false
  meaning: The search type asked for, as the service names it.
- name: totals_rows
  type: INT64
  kind: measure
  nullable: false
  meaning: The totals rows written.
  unit: rows
  sums:
    summable: true
    over:
    - web_property_id
    - search_type
    across_periods: true
- name: query_rows
  type: INT64
  kind: measure
  nullable: false
  meaning: The query rows written.
  unit: rows
  sums:
    summable: true
    over:
    - web_property_id
    - search_type
    across_periods: true
- name: rows_repeated
  type: INT64
  kind: measure
  nullable: false
  meaning: Rows a page held that an earlier page had already given. Each was written once.
  unit: rows
  sums:
    summable: true
    over:
    - web_property_id
    - search_type
    across_periods: true
- name: click_share
  type: NUMERIC
  kind: measure
  nullable: true
  meaning: The share of the totals' clicks that the query rows add up to. Null when the totals hold
    no click.
  unit: share, 0 to 1
  null_means: Null when the totals hold no click.
  sums:
    summable: false
- name: impression_share
  type: NUMERIC
  kind: measure
  nullable: true
  meaning: The share of the totals' impressions that the query rows add up to. Null when the totals
    hold no impression.
  unit: share, 0 to 1
  null_means: Null when the totals hold no impression.
  sums:
    summable: false
- name: page_rows
  type: INT64
  kind: measure
  nullable: true
  meaning: The page rows written.
  unit: rows
  null_means: The row was written before 0019.
  sums:
    summable: true
    over:
    - web_property_id
    - search_type
    across_periods: true
- name: device_rows
  type: INT64
  kind: measure
  nullable: true
  meaning: The device rows written.
  unit: rows
  null_means: The row was written before 0019.
  sums:
    summable: true
    over:
    - web_property_id
    - search_type
    across_periods: true
- name: page_click_share
  type: NUMERIC
  kind: measure
  nullable: true
  meaning: The share of the totals' clicks that the page rows add up to. Null when the totals hold no
    click, and on a pull row written before 0019.
  unit: share, 0 to 1
  null_means: Null when the totals hold no click, and on a pull row written before 0019.
  sums:
    summable: false
- name: route
  type: STRING
  kind: attribute
  nullable: true
  meaning: The route that supplied this entire week, api or export.
  null_means: A pull written before this column.
