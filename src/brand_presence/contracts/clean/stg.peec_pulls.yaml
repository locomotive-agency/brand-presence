table: stg.peec_pulls
owner: peec
version: 1
grain: One row per mapping, prompt_id, engine, period. Replaced atomically with the complete request;
  reference rows are only added.
key:
  - mapping
  - prompt_id
  - engine
  - period
columns:
  - name: client_brand_id
    type: STRING
    kind: attribute
    nullable: false
    meaning: The client brand the row was measured for, by its brand ID in the YAML configuration.
    holds: client brand
  - name: country_code
    type: STRING
    kind: attribute
    nullable: false
    meaning: The country, as a two-letter code. A pull of every country carries all.
    holds: country
  - name: location_id
    type: STRING
    kind: attribute
    nullable: false
    meaning: The location the request was for, by its ID in ref.locations. A pull of every country carries
      all.
    holds: location
  - name: benchmark_version
    type: INT64
    kind: attribute
    nullable: true
    meaning: The version of the client brand's benchmark set in the row's country, at the load the request
      was planned from.
    null_means: Unknown or not supplied. An array is empty when no members are held; citation_known states
      completeness.
  - name: snapshot_id
    type: STRING
    kind: attribute
    nullable: false
    meaning: The snapshot of the YAML configuration the request was planned from.
  - name: period
    type: STRING
    kind: key
    nullable: false
    meaning: The period of the pull that wrote the row, as the run names it. It tells apart the rows of
      two pulls of the same dates.
  - name: period_start
    type: DATE
    kind: attribute
    nullable: false
    meaning: The first day of the row's period, in the client's time zone.
  - name: request_key
    type: STRING
    kind: attribute
    nullable: false
    meaning: The vendor request the row came from.
  - name: run_id
    type: STRING
    kind: attribute
    nullable: false
    meaning: The run that wrote the row.
  - name: pulled_at
    type: TIMESTAMP
    kind: attribute
    nullable: false
    meaning: When the answer the row came from was received.
  - name: window_start
    type: DATE
    kind: attribute
    nullable: false
    meaning: The first date of the window the pull asked for.
  - name: window_end
    type: DATE
    kind: attribute
    nullable: false
    meaning: The last date of the window the pull asked for.
  - name: rows_written
    type: INT64
    kind: attribute
    nullable: false
    meaning: Answer and benchmark-brand rows written by this complete pull, excluding its marker.
  - name: pages
    type: INT64
    kind: attribute
    nullable: false
    meaning: The pages read, over both parts.
  - name: row_limit_hit
    type: BOOL
    kind: attribute
    nullable: false
    meaning: Always false on a complete Peec pull. A page cap refuses the whole request before any clean
      replacement.
  - name: source_time_zone
    type: STRING
    kind: attribute
    nullable: true
    meaning: Vendor day time zone, not yet verified. Null until the documented date semantics are
      verified; dates are never re-cut to the client zone.
    null_means: The vendor day time zone is not yet verified.
  - name: mapping
    type: STRING
    kind: key
    nullable: false
    meaning: The immutable local project mapping from the captured setup load.
  - name: prompt_id
    type: STRING
    kind: key
    nullable: false
    meaning: Opaque Peec prompt key derived from the project mapping and vendor prompt reference.
  - name: engine
    type: STRING
    kind: key
    nullable: false
    meaning: The engine asked.
  - name: complete_snapshot
    type: BOOL
    kind: attribute
    nullable: false
    meaning: True only after all listing and detail pages passed completeness checks.
  - name: chats_observed
    type: INT64
    kind: attribute
    nullable: false
    meaning: Number of distinct eligible chats in this complete request, including zero.
unknown: No inferred brand or country. Missing optional values remain null.
days: Vendor observation dates, not ingestion dates. Verify the vendor time zone before activation.
