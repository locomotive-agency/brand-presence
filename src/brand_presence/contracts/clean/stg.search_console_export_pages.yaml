table: stg.search_console_export_pages
owner: search-console
version: 1
grain: One bulk export row per client brand, web property, country, search type, date, page and period.
  Every fragment is summed at this grain. Separate from API rows, with no API row cap.
key:
- client_brand_id
- web_property_id
- country_code
- search_type
- date
- page
- period
unknown: 'The country and the location are unknown for searches the service could not place. The client
  brand never is: it is the web property''s.'
days: Search Console's own days, counted in Pacific time. Not the client's days.
columns:
- name: client_brand_id
  type: STRING
  kind: key
  nullable: false
  meaning: The client brand the row was measured for, by its brand ID in the YAML configuration.
  holds: client brand
- name: country_code
  type: STRING
  kind: key
  nullable: false
  meaning: The country, as a two-letter code. unknown where the source could not place the row.
  holds: country
- name: location_id
  type: STRING
  kind: dimension
  nullable: false
  meaning: The location the request was for, by its ID in ref.locations.
  holds: location
- name: benchmark_version
  type: INT64
  kind: attribute
  nullable: true
  meaning: The version of the client brand's benchmark set in the row's country, at the load the request
    was planned from.
  null_means: 'The client brand has no benchmark set in the row''s country, or the row belongs to none:
    a mention, or a pull of every country.'
- name: snapshot_id
  type: STRING
  kind: attribute
  nullable: false
  meaning: The snapshot of the YAML configuration the request was planned from.
- name: period
  type: STRING
  kind: key
  nullable: false
  meaning: The period of the pull that wrote the row, as the run names it. It tells apart the rows of
    two pulls of the same dates.
- name: period_start
  type: DATE
  kind: attribute
  nullable: false
  meaning: The first day of the row's period, in the client's time zone.
- name: request_key
  type: STRING
  kind: attribute
  nullable: false
  meaning: The vendor request the row came from.
- name: run_id
  type: STRING
  kind: attribute
  nullable: false
  meaning: The run that wrote the row.
- name: pulled_at
  type: TIMESTAMP
  kind: attribute
  nullable: false
  meaning: When the answer the row came from was received.
- name: web_property_id
  type: STRING
  kind: key
  nullable: false
  meaning: The Search Console site, by the ID the YAML configuration gives it. Never its address.
- name: search_type
  type: STRING
  kind: key
  nullable: false
  meaning: The search type asked for, as the service names it.
- name: date
  type: DATE
  kind: key
  nullable: false
  meaning: Search Console's own day, counted in Pacific time.
- name: page
  type: STRING
  kind: key
  nullable: false
  meaning: The page's address, as the service gives it.
- name: clicks
  type: INT64
  kind: measure
  nullable: false
  meaning: Clicks from search.
  unit: clicks
  sums:
    summable: true
    over:
    - web_property_id
    - country_code
    - search_type
    - date
    - page
    across_periods: false
- name: impressions
  type: INT64
  kind: measure
  nullable: false
  meaning: Times a page of the site was shown in search.
  unit: impressions
  sums:
    summable: true
    over:
    - web_property_id
    - country_code
    - search_type
    - date
    - page
    across_periods: false
- name: position
  type: FLOAT64
  kind: measure
  nullable: true
  meaning: The zero-based position sum divided by impressions, plus one.
  unit: place on the results page, 1 at the top, averaged over impressions
  sums:
    summable: false
  null_means: No impressions, so average position is unknown.
- name: position_sum
  type: INT64
  kind: measure
  nullable: false
  meaning: The zero-based position sum at this grain.
  unit: positions
  sums:
    summable: true
    over:
    - client_brand_id
    - web_property_id
    - country_code
    - search_type
    - page
    - date
    across_periods: false
