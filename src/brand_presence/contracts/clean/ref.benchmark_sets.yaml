table: ref.benchmark_sets
owner: setup-loader
version: 1
grain: One row per load, client brand and country, with the version of the set in force at that load.
key:
- load_number
- client_brand_id
- country_code
columns:
- name: load_number
  type: INT64
  kind: key
  nullable: false
  meaning: The number of the load that wrote the row.
- name: client_brand_id
  type: STRING
  kind: key
  nullable: false
  meaning: The client brand the set is for, by its brand ID.
  holds: client brand
- name: country_code
  type: STRING
  kind: key
  nullable: false
  meaning: The country the set is for, as a two-letter code.
  holds: country
- name: benchmark_version
  type: INT64
  kind: dimension
  nullable: false
  meaning: The version of the set in force at the load.
- name: content_hash
  type: STRING
  kind: attribute
  nullable: false
  meaning: A hash of the set's content at that version.
