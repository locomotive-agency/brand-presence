table: stg.google_ads_search_terms
owner: google-ads
version: 1
grain: One row per ad account, campaign, ad group, search term, date and period. Only campaigns the search
  terms view covers. A day with no activity has no row, and Google leaves out terms that few people searched,
  so the rows do not add up to stg.google_ads_campaigns.
key:
- ad_account_id
- campaign_id
- ad_group_id
- search_term
- date
- period
unknown: 'The country and the location are always unknown: the report does not say where an impression
  was. The client brand is unknown where the configuration names none for the account.'
days: The account's own days, counted in the time zone the account counts in, which the pull row names
  in source_time_zone. Not the client's days.
columns:
- name: client_brand_id
  type: STRING
  kind: dimension
  nullable: false
  meaning: The client brand of the ad account, or unknown where the configuration names none.
  holds: client brand
- name: country_code
  type: STRING
  kind: dimension
  nullable: false
  meaning: The country. Always unknown.
  holds: country
- name: location_id
  type: STRING
  kind: dimension
  nullable: false
  meaning: The location. Always unknown.
  holds: location
- name: benchmark_version
  type: INT64
  kind: attribute
  nullable: true
  meaning: The version of the client brand's benchmark set in the row's country, at the load the request
    was planned from.
  null_means: The row belongs to no benchmark set.
- name: snapshot_id
  type: STRING
  kind: attribute
  nullable: false
  meaning: The snapshot of the YAML configuration the request was planned from.
- name: period
  type: STRING
  kind: key
  nullable: false
  meaning: The period of the pull that wrote the row, as the run names it.
- name: period_start
  type: DATE
  kind: attribute
  nullable: false
  meaning: The first day of the row's period, in the client's time zone.
- name: request_key
  type: STRING
  kind: attribute
  nullable: false
  meaning: The vendor request the row came from.
- name: run_id
  type: STRING
  kind: attribute
  nullable: false
  meaning: The run that wrote the row.
- name: pulled_at
  type: TIMESTAMP
  kind: attribute
  nullable: false
  meaning: When the answer the row came from was received.
- name: ad_account_id
  type: STRING
  kind: key
  nullable: false
  meaning: The ID the YAML configuration gives the ad account. Never its customer ID.
- name: campaign_id
  type: INT64
  kind: key
  nullable: false
  meaning: Google's ID of the campaign.
- name: ad_group_id
  type: INT64
  kind: key
  nullable: false
  meaning: Google's ID of the ad group.
- name: search_term
  type: STRING
  kind: key
  nullable: false
  meaning: What a person typed that showed an ad, as Google gives it. Not the keyword the advertiser bid
    on. In no request, key, log line or run record.
- name: date
  type: DATE
  kind: key
  nullable: false
  meaning: The account's own day, in its own time zone.
- name: impressions
  type: INT64
  kind: measure
  nullable: false
  meaning: Times an ad was shown.
  unit: impressions
  sums:
    summable: true
    over:
    - ad_account_id
    - campaign_id
    - ad_group_id
    - search_term
    - date
- name: clicks
  type: INT64
  kind: measure
  nullable: false
  meaning: Clicks on an ad.
  unit: clicks
  sums:
    summable: true
    over:
    - ad_account_id
    - campaign_id
    - ad_group_id
    - search_term
    - date
- name: cost_micros
  type: INT64
  kind: measure
  nullable: false
  meaning: The cost exactly as reported, never converted or rounded. Costs in two currencies cannot be
    added up.
  unit: millionths of the currency in currency_code
  sums:
    summable: true
    over:
    - ad_account_id
    - campaign_id
    - ad_group_id
    - search_term
    - date
  money: true
  currency: currency_code
- name: conversions
  type: FLOAT64
  kind: measure
  nullable: false
  meaning: 'Conversions counted on the day of the click. As Google Ads knew them when the week was pulled:
    Google Ads may add to them afterwards, and a later scheduled run does not ask again.'
  unit: conversions
  sums:
    summable: true
    over:
    - ad_account_id
    - campaign_id
    - ad_group_id
    - search_term
    - date
- name: currency_code
  type: STRING
  kind: dimension
  nullable: false
  meaning: The currency of the account's costs, three letters, as its details gave it.
