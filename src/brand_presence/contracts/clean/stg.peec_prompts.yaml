table: stg.peec_prompts
owner: peec
version: 1
grain: One observed prompt version per mapping, prompt, observation time and discovery period. Append
  only, including archive transitions.
key:
- mapping
- prompt_id
- version
- observed_at
- period
columns:
- name: client_brand_id
  type: STRING
  kind: attribute
  nullable: false
  meaning: The client brand the row was measured for, by its brand ID in the YAML configuration.
  holds: client brand
- name: country_code
  type: STRING
  kind: attribute
  nullable: false
  meaning: Country from user_location.country, checked against the project mapping.
  holds: country
- name: location_id
  type: STRING
  kind: attribute
  nullable: false
  meaning: The location the request was for, by its ID in ref.locations. A pull of every country carries
    all.
  holds: location
- name: benchmark_version
  type: INT64
  kind: attribute
  nullable: true
  meaning: The version of the client brand's benchmark set in the row's country, at the load the request
    was planned from.
  null_means: Unknown or not supplied. An array is empty when no members are held; citation_known states
    completeness.
- name: snapshot_id
  type: STRING
  kind: attribute
  nullable: false
  meaning: The snapshot of the YAML configuration the request was planned from.
- name: period
  type: STRING
  kind: key
  nullable: false
  meaning: The period of the pull that wrote the row, as the run names it. It tells apart the rows of
    two pulls of the same dates.
- name: period_start
  type: DATE
  kind: attribute
  nullable: false
  meaning: The first day of the row's period, in the client's time zone.
- name: request_key
  type: STRING
  kind: attribute
  nullable: false
  meaning: The vendor request the row came from.
- name: run_id
  type: STRING
  kind: attribute
  nullable: false
  meaning: The run that wrote the row.
- name: pulled_at
  type: TIMESTAMP
  kind: attribute
  nullable: false
  meaning: When the answer the row came from was received.
- name: mapping
  type: STRING
  kind: key
  nullable: false
  meaning: Immutable local project mapping.
- name: prompt_id
  type: STRING
  kind: key
  nullable: false
  meaning: Opaque pipeline prompt key, derived from mapping and vendor reference.
- name: vendor_prompt_id
  type: STRING
  kind: attribute
  nullable: false
  meaning: Protected Peec prompt reference; never logged.
  shared: false
- name: version
  type: STRING
  kind: key
  nullable: false
  meaning: Hash of the canonical prompt fields, including archive state.
- name: prompt_text
  type: STRING
  kind: attribute
  nullable: false
  meaning: Text from the single messages item content, authored in Peec.
- name: topic_id
  type: STRING
  kind: attribute
  nullable: true
  meaning: Peec topic reference; null means no topic.
  null_means: No value supplied by Peec.
- name: tag_ids
  type: ARRAY<STRING>
  kind: attribute
  nullable: true
  meaning: Peec tag references in sorted order; empty means none.
  null_means: No value supplied by Peec.
- name: created_at
  type: TIMESTAMP
  kind: attribute
  nullable: false
  meaning: Peec gives the creation day only, with no time or zone. Held as 00:00 UTC on that day.
- name: is_archived
  type: BOOL
  kind: attribute
  nullable: false
  meaning: Peec archive state. Archived prompts receive no new chat pulls.
- name: observed_at
  type: TIMESTAMP
  kind: key
  nullable: false
  meaning: Time this run observed the version. Earlier versions remain stored.
days: Peec creation days have no time or zone and are held as 00:00 UTC on that day. Observation
  and pull times are UTC; no dates are re-cut.
unknown: Brand, country and location are explicit. Missing optional topic stays null; an empty tag array
  means none.
