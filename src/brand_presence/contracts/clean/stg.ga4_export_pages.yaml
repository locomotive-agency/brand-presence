table: stg.ga4_export_pages
owner: ga4
version: 1
grain: One row per client brand, web property, month, page path and period, read from the property's GA4
  BigQuery export, for every country together. Users are distinct for the row's page and month.
key:
- client_brand_id
- web_property_id
- month
- page_path
- period
unknown: Never. A page row counts every country together and carries the reserved value all as its country
  and its location, not unknown.
days: The GA4 property's own days, counted in the property's time zone, by which the export names
  each daily table. A month is a month of those days. Not the client's days.
columns:
- name: client_brand_id
  type: STRING
  kind: key
  nullable: false
  meaning: The client brand the row was measured for, by its brand ID in the YAML configuration.
  holds: client brand
- name: country_code
  type: STRING
  kind: dimension
  nullable: false
  meaning: 'all: a page row counts every country together.'
  holds: country
- name: location_id
  type: STRING
  kind: dimension
  nullable: false
  meaning: 'all: a page row counts every country together.'
  holds: location
- name: benchmark_version
  type: INT64
  kind: attribute
  nullable: true
  meaning: The version of the client brand's benchmark set in the row's country, at the load the request
    was planned from.
  null_means: A page row counts every country together, and belongs to no benchmark set.
- name: snapshot_id
  type: STRING
  kind: attribute
  nullable: false
  meaning: The snapshot of the YAML configuration the request was planned from.
- name: period
  type: STRING
  kind: key
  nullable: false
  meaning: 'The period of the pull that wrote the row, as the run names it. A month is read by every weekly
    pull until the month after it has ended, and period tells their rows apart: the newest period''s row
    is the month''s figure.'
- name: period_start
  type: DATE
  kind: attribute
  nullable: false
  meaning: The first day of the row's period, in the client's time zone.
- name: request_key
  type: STRING
  kind: attribute
  nullable: false
  meaning: The vendor request the row came from.
- name: run_id
  type: STRING
  kind: attribute
  nullable: false
  meaning: The run that wrote the row.
- name: pulled_at
  type: TIMESTAMP
  kind: attribute
  nullable: false
  meaning: When the answer the row came from was received.
- name: web_property_id
  type: STRING
  kind: key
  nullable: false
  meaning: The GA4 property, by the ID the YAML configuration gives it. Never its number, and never the export's
    name.
- name: month
  type: DATE
  kind: key
  nullable: false
  meaning: The first day of the month the row counts.
- name: through_date
  type: DATE
  kind: attribute
  nullable: false
  meaning: 'The last day of the month the row counts: the last day of it, up to the period''s last date,
    that the export holds a daily table of. A month is whole when this is its last day; the pull row''s
    days_without_table counts the days with no table.'
- name: page_path
  type: STRING
  kind: key
  nullable: false
  meaning: The path of the page's address, with no query string and no fragment. (other) folds the pages
    past the month's most viewed; (not set) is an event with no page address.
- name: page_views
  type: INT64
  kind: measure
  nullable: false
  meaning: 'Page views: page_view events on the page.'
  unit: views
  sums:
    summable: true
    over:
    - web_property_id
    - month
    - page_path
    across_periods: false
- name: users
  type: INT64
  kind: measure
  nullable: false
  meaning: 'Distinct users who viewed the page in the month. It cannot be summed: a user who viewed two
    pages is in both.'
  unit: users
  sums:
    summable: false
- name: engagement_seconds
  type: NUMERIC
  kind: measure
  nullable: false
  meaning: User engagement duration on the page, summed over its events.
  unit: seconds
  sums:
    summable: true
    over:
    - web_property_id
    - month
    - page_path
    across_periods: false
