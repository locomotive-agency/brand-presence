table: stg.google_ads_geo_cities
owner: google-ads
version: 1
grain: One row per ad account, campaign, country, city, location type, date and period. The city is
  a city the client lists for google-ads, or other for every other place of the country. A day with
  no activity has no row. Within one answer the city rows of a country add up to that answer's rows;
  they are not promised to equal stg.google_ads_geo, which comes from another request.
key:
- ad_account_id
- campaign_id
- date
- country_code
- city_id
- location_type
- period
unknown: The country and the location are unknown where the row holds no country criterion, or one the
  country table does not give. The client brand is unknown where the configuration names none for the account.
days: The account's own days, counted in the time zone the account counts in, which the pull row names
  in source_time_zone. Not the client's days.
columns:
- name: client_brand_id
  type: STRING
  kind: dimension
  nullable: false
  meaning: The client brand of the ad account, or unknown where the configuration names none.
  holds: client brand
- name: country_code
  type: STRING
  kind: key
  nullable: false
  meaning: The country the report gives, as a two-letter code, whether or not the client lists it; unknown
    where the row holds no country criterion.
  holds: country
- name: location_id
  type: STRING
  kind: dimension
  nullable: false
  meaning: The listed city's location, or for an other row the location of kind country for the
    row's country in the load, or unknown.
  holds: location
- name: benchmark_version
  type: INT64
  kind: attribute
  nullable: true
  meaning: The version of the client brand's benchmark set in the row's country, at the load the request
    was planned from.
  null_means: The row belongs to no benchmark set.
- name: snapshot_id
  type: STRING
  kind: attribute
  nullable: false
  meaning: The snapshot of the YAML configuration the request was planned from.
- name: period
  type: STRING
  kind: key
  nullable: false
  meaning: The period of the pull that wrote the row, as the run names it.
- name: period_start
  type: DATE
  kind: attribute
  nullable: false
  meaning: The first day of the row's period, in the client's time zone.
- name: request_key
  type: STRING
  kind: attribute
  nullable: false
  meaning: The vendor request the row came from.
- name: run_id
  type: STRING
  kind: attribute
  nullable: false
  meaning: The run that wrote the row.
- name: pulled_at
  type: TIMESTAMP
  kind: attribute
  nullable: false
  meaning: When the answer the row came from was received.
- name: ad_account_id
  type: STRING
  kind: key
  nullable: false
  meaning: The ID the YAML configuration gives the ad account. Never its customer ID.
- name: campaign_id
  type: INT64
  kind: key
  nullable: false
  meaning: Google's ID of the campaign.
- name: country_criterion_id
  type: INT64
  kind: attribute
  nullable: true
  meaning: Google's number for the country, as reported.
  null_means: The row holds no country criterion; its country is unknown.
- name: city_criterion_id
  type: INT64
  kind: attribute
  nullable: true
  meaning: Google's criterion ID of the listed city, as its location constant gives it.
  null_means: The row is other, which folds every place of the country that is no listed city.
- name: city_id
  type: STRING
  kind: key
  nullable: false
  meaning: 'The location ID of a city the client lists for google-ads, or other: every other place of
    the country, rows with no city among them. other is not a city.'
- name: location_type
  type: STRING
  kind: key
  nullable: false
  meaning: presence where the person was in the place, interest where they showed interest in it.
- name: date
  type: DATE
  kind: key
  nullable: false
  meaning: The account's own day, in its own time zone.
- name: impressions
  type: INT64
  kind: measure
  nullable: false
  meaning: Times an ad was shown.
  unit: impressions
  sums:
    summable: true
    over:
    - ad_account_id
    - campaign_id
    - date
    - country_code
    - city_id
    - location_type
- name: clicks
  type: INT64
  kind: measure
  nullable: false
  meaning: Clicks on an ad.
  unit: clicks
  sums:
    summable: true
    over:
    - ad_account_id
    - campaign_id
    - date
    - country_code
    - city_id
    - location_type
- name: cost_micros
  type: INT64
  kind: measure
  nullable: false
  meaning: The cost exactly as reported, or on an other row the sum of the costs it folds, all of one
    account. Never converted or rounded. Costs in two currencies cannot be added up.
  unit: millionths of the currency in currency_code
  sums:
    summable: true
    over:
    - ad_account_id
    - campaign_id
    - date
    - country_code
    - city_id
    - location_type
  money: true
  currency: currency_code
- name: conversions
  type: FLOAT64
  kind: measure
  nullable: false
  meaning: 'Conversions counted on the day of the click. As Google Ads knew them when the week was pulled:
    Google Ads may add to them afterwards, and a later scheduled run does not ask again.'
  unit: conversions
  sums:
    summable: true
    over:
    - ad_account_id
    - campaign_id
    - date
    - country_code
    - city_id
    - location_type
- name: currency_code
  type: STRING
  kind: dimension
  nullable: false
  meaning: The currency of the account's costs, three letters, as its details gave it.
